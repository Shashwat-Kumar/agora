# Weekly swarm run. Move to .github/workflows/ once the token has the `workflow` scope (see docs/SCHEDULING.md).
name: agora-weekly
on:
  schedule: [{cron: "0 5 * * 2"}]   # Tuesdays 05:00 UTC = 10:30 IST
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          THREAD_PATH=$(python -m agora.cli run --turns 24)
          python -m agora.cli check "$THREAD_PATH"
        env:
          AGORA_PROVIDER: ${{ vars.AGORA_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "agora-bot"; git config user.email "agora-bot@users.noreply.github.com"
          git add threads && git commit -m "Weekly Agora thread (AI personas)" && git push || echo "nothing to commit"
