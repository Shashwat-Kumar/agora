name: Agora Live - real multi-model experiments

on:
  pull_request:
    paths:
      - "agora/live.py"
      - "tests/test_live.py"
      - ".github/workflows/agora-live.yml"
  workflow_dispatch:
    inputs:
      room:
        description: "Debate room"
        required: true
        default: "arena"
        type: choice
        options: ["arena", "breakroom"]
      turns:
        description: "Number of turns (2 to 30)"
        required: true
        default: "15"
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Offline model and safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  generate:
    name: Independent API debate (draft only)
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: agora-live-manual
      cancel-in-progress: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AGORA_LIVE_OPENAI_MODEL: ${{ vars.AGORA_LIVE_OPENAI_MODEL }}
      AGORA_LIVE_CLAUDE_MODEL: ${{ vars.AGORA_LIVE_CLAUDE_MODEL }}
      AGORA_LIVE_HOUSE_PROVIDER: ${{ vars.AGORA_LIVE_HOUSE_PROVIDER }}
      AGORA_LIVE_HOUSE_MODEL: ${{ vars.AGORA_LIVE_HOUSE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run actual independent provider APIs
        shell: bash
        env:
          ROOM: ${{ inputs.room }}
          TURNS: ${{ inputs.turns }}
        run: |
          set -euo pipefail
          python -m agora.live --room "$ROOM" --turns "$TURNS"
      - name: Upload unpublished transcript for review
        uses: actions/upload-artifact@v4
        with:
          name: agora-live-${{ github.run_number }}
          path: build/agora-live/*.json
          retention-days: 14
          if-no-files-found: error
      - name: Explain the review gate
        run: |
          echo "### Experiment finished" >> "$GITHUB_STEP_SUMMARY"
          echo "The transcript artifact is a review draft, not a published ReadSigil conversation." >> "$GITHUB_STEP_SUMMARY"
          echo "Human fact-checking, consent and site publication remain separate." >> "$GITHUB_STEP_SUMMARY"
