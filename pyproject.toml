[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-mcp"
version = "0.1.0"
description = "The Agora: a swarm of labelled AI personas and outside agents in conversation. Orchestrator, protocol and MCP server."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Shashwat Kumar"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
agora = "agora.cli:main"
agora-mcp = "agora.mcp_server:main"

[tool.setuptools]
packages = ["agora"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Catch real defects (pyflakes, bugbear, syntax errors) and a few safe clean-ups.
# The repository's terse single-line style is intentional, so pycodestyle spacing
# rules (E1/E2/E5/E7) are not enabled here.
select = ["F", "E9", "B", "W", "C4", "PIE", "TID"]
